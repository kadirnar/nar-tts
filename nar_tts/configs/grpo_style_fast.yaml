# LoRA style-steering scenario inspired by GLASS: optimize a shorter/faster
# acoustic direction while CER/NLL and speaker similarity remain quality anchors.

model:
  checkpoint: "checkpoints/checkpoint-171622"
  tokenizer: "checkpoints/checkpoint-171622"
  loader: transformers
  revision: null
  tokenizer_revision: null
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
  low_cpu_mem_usage: true

dataset:
  path: parquet
  data_files: "/scratch/kadirnar/ja-en-syn-qwen3-mimi32/data/*.parquet"
  split: train
  mode: tts_tokens
  columns:
    input_ids: input_ids
    language: null
    target_duration_seconds: null
  streaming: false
  max_samples: 4000
  max_prompt_tokens: 2048
  shuffle: true
  seed: 42
  on_invalid: drop
  preprocess_workers: 1

peft:
  enabled: true
  rank: 8
  alpha: 16
  dropout: 0.0
  use_rslora: true
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none

action_space:
  constrain_log_probs: true

rollout:
  backend: transformers

generation:
  frame_rate: 12.5
  min_audio_seconds: 0.4
  max_audio_seconds: 10.0
  temperature: 0.9
  top_p: 0.95
  top_k: 0
  repetition_penalty: 1.0

grpo:
  num_generations: 4
  num_generations_eval: 4
  generation_batch_size: 4
  beta: 0.05
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.2
  importance_sampling_level: token
  scale_rewards: group
  loss_type: dapo
  mask_truncated_completions: true
  entropy_coef: 0.0
  use_transformers_continuous_batching: false

rewards:
  invalid_reward: 0.0
  weights:
    intelligibility: 0.65
    speaker: 0.20
    duration: 0.0
    speed: 0.15
    format: 0.0
  codec:
    model: kyutai/mimi
    revision: null
    device: auto
    dtype: bfloat16
  asr:
    enabled: true
    model: Qwen/Qwen3-ASR-1.7B-hf
    revision: null
    device: auto
    dtype: bfloat16
    batch_size: 4
    language: null
    max_new_tokens: 256
    compile: true
    metric: cer
    error_weight: 1.0
    error_alpha: 3.0
    nll_weight: 0.0
    nll_alpha: 3.0
    nll_reduction: mean
  speaker:
    enabled: true
    backend: espnet
    model: espnet/voxcelebs12_ecapa_wavlm_joint
    revision: null
    device: auto
    dtype: float32
    batch_size: 4
    reference_cache_size: 2048
    minimum: 0.0
  duration:
    mode: smooth_log
    tolerance: [0.75, 1.25]
    scale: 0.35
  speed:
    direction: fast            # change to slow for the opposite LoRA direction
    max_seconds: 10.0

training:
  output_dir: "checkpoints_grpo_style_fast"
  epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch_fused
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: false
  logging_steps: 1
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  seed: 42
  resume_from_checkpoint: null

runtime:
  expected_world_size: 1
  dataloader_workers: auto
  pin_memory: true

logging:
  enabled: true
  report_to: wandb
  project: nar-tts-grpo-style
  run_name: grpo-style-fast
  entity: null
  log_completions: true
  num_completions_to_print: 2
