# Pretraining config for pretrain.py (the default recipe).

# Model
model_name: "Qwen/Qwen3-0.6B"
tokenizer_name: "Qwen/Qwen3-0.6B"

# Training
epochs: 1
batch_size: 8                # per device
number_processes: 8          # = num GPUs (must match accelerate_config.yaml)
pad_token: 151643            # Qwen3 <|endoftext|> (collator pad value)
save_steps: 10000
learning_rate: 5.0e-5
ratio: "1:0"                 # text:speech, decayed across training.
                             #   "1:0" -> start 50/50, end pure speech (TTS recipe)
                             #   "2:1" -> start 2/3 text, end 50/50 (keeps more text)

# Datasets (local parquet, pre-tokenized to input_ids; both shuffled in pretrain.py)
#   text-QA: encode_textqa.py output (SynDataLab/DeepSeekFlash-3M-en+ja)
#   TTS    : encode_pretrain.py output (YT-Data/ja-en-syn, Mimi-encoded)
text_QA_dataset: "/scratch/kadirnar/textqa-qwen3/data"
TTS_dataset: "/scratch/kadirnar/ja-en-syn-qwen3-mimi32/data"

# Output / logging
save_folder: "checkpoints"
project_name: "qwen3-ja-en-tts_ratio1to0"
run_name: "qwen3-ja-en-mimi"
