# Nar checkpoint -> quality alignment. Main-model fields are architecture-neutral.

model:
  checkpoint: "/path/to/nar-checkpoint"          # REQUIRED
  tokenizer: null                                 # null = use checkpoint
  loader: transformers
  revision: null
  tokenizer_revision: null
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false

tokens:
  text_eos_token_id: null                         # REQUIRED
  pad_token_id: null                              # REQUIRED

dataset:
  path: parquet
  data_files: "/path/to/grpo/*.parquet"           # REQUIRED
  split: train
  mode: tts_tokens
  columns:
    input_ids: input_ids
    language: language
    target_duration_seconds: null
    emotion: emotion
    intensity: intensity
    delivery: delivery
    valence: valence
    arousal: arousal
    events: events
    hard_case: hard_case
  streaming: false
  max_samples: 4000
  max_prompt_tokens: 2048
  shuffle: true
  seed: 42
  on_invalid: drop
  preprocess_workers: 1
  hard_case_multiplier: 4

peft:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.0
  use_rslora: true
  target_modules: all-linear
  bias: none

generation:
  frame_rate: 12.5
  min_audio_seconds: 0.4
  max_audio_seconds: 12.0
  temperature: 1.0
  top_p: 1.0

grpo:
  num_generations: 8
  generation_batch_size: 8
  beta: 0.1
  multi_objective_aggregation: normalize_then_sum
  scale_rewards: batch
  loss_type: dapo
  mask_truncated_completions: true

rewards:
  invalid_reward: 0.0
  weights:
    intelligibility: 0.60
    speaker: 0.15
    duration: 0.05
    naturalness: 0.08
    prosody: 0.05
    speaker_drift: 0.07
    emotion: 0.0
    event: 0.0
  codec:
    model: kyutai/mimi
    device: auto
    dtype: bfloat16
  asr:
    enabled: true
    model: Qwen/Qwen3-ASR-1.7B-hf
    device: auto
    dtype: bfloat16
    batch_size: 1
    compile: true
    metric: cer
    error_weight: 0.6
    nll_weight: 0.4
    nll_reduction: sum
  speaker:
    enabled: true
    backend: espnet
    model: espnet/voxcelebs12_ecapa_wavlm_joint
    device: auto
    dtype: float32
    reference_cache_size: 2048
  duration:
    mode: binary
    tolerance: [0.75, 1.25]
  speaker_drift:
    enabled: true
    window_seconds: 2.5
    hop_seconds: 1.25
  emotion:
    enabled: false
    model: null
  event:
    enabled: false
    model: null

training:
  output_dir: checkpoints/grpo
  epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  save_steps: 100
  save_total_limit: 3
  logging_steps: 1
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  seed: 42
  resume_from_checkpoint: null

runtime:
  expected_world_size: 8
  dataloader_workers: auto
  pin_memory: true

logging:
  enabled: true
  report_to: wandb
  project: nar-tts-grpo
  run_name: grpo
  entity: null
  group: null
  tags: []
  mode: online
  log_completions: true
  num_completions_to_print: 2
