# Nar checkpoint -> supervised adaptation. This one file supports Transformers
# and Unsloth; change model.loader instead of creating a model-specific YAML.

model:
  checkpoint: "/path/to/nar-checkpoint"         # REQUIRED
  tokenizer: null                                # null = use checkpoint
  loader: transformers                           # transformers or unsloth
  revision: null
  tokenizer_revision: null
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
  use_liger_model: true
  unsloth:
    load_in_4bit: false
    load_in_8bit: false
    max_seq_length: 8192
    device_map: null
    gradient_checkpointing: unsloth
  peft:
    enabled: false                                # true = LoRA for either loader
    rank: 16
    alpha: 32
    dropout: 0.0
    use_rslora: true
    target_modules: all-linear
    bias: none

tokens:
  text_eos_token_id: null                         # REQUIRED
  pad_token_id: null                              # REQUIRED

dataset:
  path: parquet
  data_files: "/path/to/sft/*.parquet"            # REQUIRED
  split: train
  streaming: false
  max_samples: null
  shuffle: true
  seed: 42

training:
  output_dir: checkpoints/finetune
  epochs: 10
  max_steps: -1
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  weight_decay: 0.0
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  logging_steps: 1
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: false
  seed: 42
  resume_from_checkpoint: null

runtime:
  dataloader_workers: auto
  pin_memory: true

logging:
  enabled: true
  report_to: wandb
  project: nar-tts-finetune
  run_name: finetune
  entity: null
  group: null
  tags: []
  mode: online
