# External SGLang rollout server with a live LoRA adapter. The server and
# trainer must share adapter_sync_dir. Start the server through
# `python -m nar_tts.integrations.sglang_server --config ...` on a rollout GPU.
extends: grpo_intelligibility.yaml

rollout:
  backend: sglang
  sglang:
    base_url: http://127.0.0.1:30000
    model_path: "checkpoints/checkpoint-171622"
    adapter_sync_dir: "/scratch/kadirnar/nar-sglang-live-adapter"
    adapter_name: nar_grpo_live
    timeout: 300.0
    api_key: null
    tensor_parallel_size: 1
    max_lora_rank: 16
    lora_target_modules: all
    pin_adapter: true
    server_args: ["--mem-fraction-static", "0.80"]

training:
  output_dir: "checkpoints_grpo_sglang"

logging:
  run_name: grpo-intelligibility-sglang

