# Practical single-GPU post-pretraining recipe. It keeps the paper's combined
# transcription-error + ASR-NLL signal with the full Qwen3-ASR-1.7B reward
# model and G=4 alongside a 0.6B Nar policy and Mimi.

model:
  checkpoint: "checkpoints/checkpoint-171622"
  tokenizer: "checkpoints/checkpoint-171622"  # saved expanded Nar tokenizer
  loader: transformers
  revision: null
  tokenizer_revision: null
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
  low_cpu_mem_usage: true

dataset:
  path: parquet
  data_files: "/scratch/kadirnar/ja-en-syn-qwen3-mimi32/data/*.parquet"
  split: train
  mode: tts_tokens             # split existing pretraining input_ids at SOS
  columns:
    input_ids: input_ids
    language: null             # set to a column name to use metric: auto
    target_duration_seconds: null
  streaming: false
  max_samples: 4000
  max_prompt_tokens: 2048
  shuffle: true
  seed: 42
  on_invalid: drop
  preprocess_workers: 1

peft:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.0
  use_rslora: true
  target_modules: all-linear
  bias: none

action_space:
  # Uses the same 32-codebook distribution for generation and policy log-probs.
  constrain_log_probs: true

rollout:
  backend: transformers

generation:
  frame_rate: 12.5
  min_audio_seconds: 0.4
  max_audio_seconds: 10.0
  temperature: 0.9
  top_p: 0.95
  top_k: 0
  repetition_penalty: 1.0

grpo:
  num_generations: 4
  num_generations_eval: 4
  generation_batch_size: 4
  beta: 0.1                  # PEFT reuses the frozen base; no second policy copy
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.2
  importance_sampling_level: token
  scale_rewards: group
  loss_type: dapo
  mask_truncated_completions: true
  entropy_coef: 0.0
  use_transformers_continuous_batching: false

rewards:
  invalid_reward: 0.0
  weights:
    intelligibility: 0.95
    speaker: 0.0
    duration: 0.05
    speed: 0.0
    format: 0.0
  codec:
    model: kyutai/mimi
    revision: null
    device: auto
    dtype: bfloat16
  asr:
    enabled: true
    model: Qwen/Qwen3-ASR-1.7B-hf
    revision: null
    device: auto
    dtype: bfloat16
    batch_size: 4
    language: null
    max_new_tokens: 256
    compile: true
    metric: cer
    error_weight: 0.6
    error_alpha: 3.0
    nll_weight: 0.4
    nll_alpha: 3.0
    # Mean is less transcript-length-sensitive. The paper-faithful multi-GPU
    # scenario uses sum.
    nll_reduction: mean
  speaker:
    enabled: false
  duration:
    mode: smooth_log
    tolerance: [0.75, 1.25]
    scale: 0.35
  speed:
    direction: fast
    max_seconds: 10.0

training:
  output_dir: "checkpoints_grpo_intelligibility"
  epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4  # effective G=4 group, microbatch remains 1
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch_fused
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  use_liger_kernel: false
  logging_steps: 1
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  seed: 42
  resume_from_checkpoint: null

runtime:
  expected_world_size: 1
  dataloader_workers: auto
  pin_memory: true

logging:
  enabled: true
  report_to: wandb
  project: nar-tts-grpo
  run_name: grpo-intelligibility-g4
  entity: null
  log_completions: true
  num_completions_to_print: 2
