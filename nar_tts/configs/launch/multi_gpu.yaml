# Eight ranks form one G=8 rollout group in grpo_multireward.yaml. Change both
# num_processes and runtime.expected_world_size together for another GPU count;
# the effective batch must remain divisible by grpo.num_generations.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: true
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
use_cpu: false

