# Nar TTS streaming source -> Qwen/Mimi tokenization -> Hugging Face upload.
# Authentication: run `hf auth login` once. Leave hub.token null so the saved
# credential is used; never commit a real access token to this file.

source:
  repo: "YT-Data/ja-en-syn"
  revision: null                  # null = resolve and durably pin current HEAD
  local_root: null                # null = stream shards from the Hub on demand

target:
  repo: "YT-Data/ja-en-syn-qwen3-mimi32"
  push_to_hub: true
  private: false
  output_root: "/scratch/kadirnar/ja-en-syn-qwen3-mimi32"
  download_root: "/scratch/kadirnar/ja-en-syn-qwen3-mimi32/.downloads"

hub:
  token: null                     # null = token saved by `hf auth login`

runtime:
  num_gpus: 1
  cpu_workers: auto               # all CPUs in this process's affinity mask
  tokenizer_threads: 2
  decode_backend: thread          # thread or process
  decode_prefetch: auto           # auto = 4 * cpu_workers
  download_prefetch: 1            # source shards staged ahead of the current one

tokenizer:
  model: "Qwen/Qwen3-4B"
  revision: null                  # resolved and pinned in run-state.json

mimi:
  model: "kyutai/mimi"
  revision: null                  # resolved and pinned in run-state.json
  dtype: null                     # null=float32; bfloat16 is faster but changes IDs
  compile: false
  compile_mode: default
  allow_tf32: true

tokenization:
  gpu_batch_size: 32
  bucket_size: 256
  max_batch_seconds: 300
  read_batch_size: 2048
  row_group_size: 256
  min_audio_seconds: 0.2
  max_audio_seconds: 30.0

transfer:
  attempts: 5
  delete_downloaded_source: true
  keep_failed_downloads: false
  delete_after_upload: true
  hub_prefix_chars: 2
  upload_batch_files: 64
  upload_batch_gb: 8
  upload_flush_seconds: 30
  max_upload_staging_gb: 24

resume:
  reset_run_state: false
  accept_remote_state_change: false
  adopt_legacy_target: false
