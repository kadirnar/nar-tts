# Alternative pretraining config: Llama-3.2-1B instead of Qwen3.
# Legacy / not the default. To use it, point CONFIG_PATH in pretrain.py here AND
# set fsdp_transformer_layer_cls_to_wrap: LlamaDecoderLayer in accelerate_config.yaml.

# Model
model_name: "meta-llama/Llama-3.2-1B-Instruct"
tokenizer_name: "meta-llama/Llama-3.2-1B-Instruct"

# Training
epochs: 1
batch_size: 24
number_processes: 8
pad_token: 128263
save_steps: 12000
learning_rate: 5.0e-5
ratio: "2:1"

# Datasets
text_QA_dataset: "Vyvo/Emilia-All-EN-Snac-LLama3.2"
TTS_dataset: "Vyvo/Emilia-All-EN-Snac-LLama3.2"

# Output / logging
save_folder: "checkpoints"
project_name: "llama3-tts-v0"
run_name: "llama3-tts-v0"
