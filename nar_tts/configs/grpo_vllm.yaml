# High-throughput colocated vLLM rollouts. The Nar package must be installed
# editable so vLLM auto-discovers its 32-codebook logits processor.
extends: grpo_intelligibility.yaml

rollout:
  backend: vllm
  vllm:
    mode: colocate             # use server for a dedicated rollout node
    model_impl: vllm
    gpu_memory_utilization: 0.30
    tensor_parallel_size: 1
    max_model_length: null
    enable_sleep_mode: true
    server_base_url: null
    server_host: 0.0.0.0
    server_port: 8000
    server_timeout: 300.0
    group_port: 51216
    importance_sampling_correction: true
    importance_sampling_mode: sequence_mask
    importance_sampling_clip_max: 3.0

training:
  output_dir: "checkpoints_grpo_vllm"

logging:
  run_name: grpo-intelligibility-vllm

